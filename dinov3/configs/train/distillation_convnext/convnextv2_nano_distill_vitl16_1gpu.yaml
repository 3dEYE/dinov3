MODEL:
  META_ARCHITECTURE: SSLMetaArch

# Single-student distillation setup:
# teacher = ViT-L/16 checkpoint, student = ConvNeXtV2-N.
distillation:
  enabled: true
  full_cfg_path: dinov3/configs/train/vitl_im1k_lin834.yaml
  checkpoint_path: <PATH/TO/VITL16_TEACHER_CHECKPOINT>

student:
  arch: convnextv2_nano
  patch_size: 16
  drop_path_rate: 0.0
  block_chunks: 4
  fp8_enabled: false
  fp8_filter: blocks

# ViT-L config uses 65536 prototypes for both DINO and iBOT heads.
# These values must match for distillation asserts to pass.
dino:
  head_n_prototypes: 65536

ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.5
  mask_random_circular_shift: false
  force_masking_even_with_zero_weight: false
  separate_head: true
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048
  head_n_prototypes: 65536

train:
  dataset_path: ImageNet:split=TRAIN:root=<PATH/TO/DATASET_ROOT>:extra=<PATH/TO/DATASET_EXTRA>
  batch_size_per_gpu: 1
  num_workers: 6
  cache_dataset: false
  centering: sinkhorn_knopp
  compile: false

crops:
  global_crops_size: 224
  local_crops_size: 96
  teacher_to_student_resolution_scale: 1.0

optim:
  epochs: 100
  clip_grad: 3.0
  layerwise_decay: 1.0

schedules:
  lr:
    start: 1e-6
    peak: 5e-5
    end: 1e-6
    warmup_epochs: 10
    freeze_last_layer_epochs: 1
  weight_decay:
    start: 0.04
    end: 0.2
    peak: 0.2
    warmup_epochs: 100
  teacher_temp:
    start: 0.04
    peak: 0.07
    end: 0.07
    warmup_epochs: 30
  momentum:
    start: 0.994
    peak: 1.0
    end: 1.0
    warmup_epochs: 100
