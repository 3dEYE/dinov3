MODEL:
  META_ARCHITECTURE: MultiDistillationMetaArch
multidistillation:
  enabled: true
  global_batch_size: 32  # 4096 for 16 nodes
  students:
  - name: convnextv2_nano
    config_path: dinov3/configs/train/distillation_convnext/convnextv2_nano_p16.yaml
    ranks_range:
    - 0
    - 2
  - name: convnextv2_tiny
    config_path: dinov3/configs/train/distillation_convnext/convnextv2_tiny_p16.yaml
    ranks_range:
    - 2
    - 4
  - name: convnextv2_base
    config_path: dinov3/configs/train/distillation_convnext/convnextv2_base_p16.yaml
    ranks_range:
    - 4
    - 6
  - name: convnextv2_large
    config_path: dinov3/configs/train/distillation_convnext/convnextv2_large_p16.yaml
    ranks_range:
    - 6
    - 8
distillation:  # teacher
  enabled: true
  full_cfg_path: dinov3/configs/train/vitl_im1k_lin834.yaml
  checkpoint_path: ignore
crops:
  global_crops_size: 512
  local_crops_size: 224
  teacher_to_student_resolution_scale: 2.0
train:
  dataset_path: ImageNet:split=TRAIN
  cache_dataset: false
  centering: "sinkhorn_knopp"
  compile: true
ibot:
  separate_head: true